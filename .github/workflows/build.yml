name: Build APK and show errors

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: gradle assembleDebug --stacktrace --console=plain > build.log 2>&1

      - name: Show errors in summary
        if: always()
        run: |
          echo "## Build result: ${{ steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo '### Main errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -n -E -A 12 "What went wrong|^e: |error:" build.log | head -n 60 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### Last 40 lines' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 40 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-CIRCLE-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
