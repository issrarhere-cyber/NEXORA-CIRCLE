name: Setup and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          unzip -q NEXORA-CIRCLE-stage1.zip -d /tmp/unz
          rm -rf /tmp/unz/NEXORA-CIRCLE/.github
          cp -a /tmp/unz/NEXORA-CIRCLE/. .
          ls -la

      - name: Save unpacked files to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack Stage 1 project"
          git push

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-CIRCLE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
